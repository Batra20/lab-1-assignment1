<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #eventForm{
            display: flex;
            flex-direction: column;
            border: 2px solid black;
            width: 300px;
            padding: 20px;
            gap: 5px;
        }

        #rightBox{
            border: 2px solid black;
            width: 500px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        #eventDashboard{
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 20px;
        }


        .eachList{
            border: 2px solid black;
            height: 100px;
            width: 200px;
            position: relative;
        }


        .delBtn{
            position: absolute;
            right: 5px;
            top: 0px;
        }
    </style>
</head>
<body>

    <div id="eventDashboard">
        <div id="leftBox">
            <form id="eventForm" onsubmit="eventSubmitHandler(event)">
                <label>Title</label>
                <input type="text" name="title"/>

                <label>Date</label>
                <input type="date" name="date"/>

                <label>Categories</label>
                <select name="categories">
                    <option>social</option>
                    <option>Meetup</option>
                    <option>Hackathon</option>
                </select>

                <label >Description</label>
   
                <textarea name="description"></textarea>

                <button type="submit">Add Event</button>
            </form>
        </div>

        <div id="rightBox">
            <!-- <div class="eachList">
                <p>Title</p>
                <p>date</p>
                <p>description</p>
                <p>categories</p>
                <span class="delBtn">&#10005;</span>

            </div> -->
           
        </div>
    </div>
    
    <script src="./script.js"></script>
</body>
</html>
